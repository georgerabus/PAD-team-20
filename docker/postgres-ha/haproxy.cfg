# One HAProxy per cluster, under the database host name its service already
# uses. CLUSTER is the nodes' common prefix: CLUSTER-1, CLUSTER-2, CLUSTER-3.
# Each node's Patroni says what it is on port 8008: /primary answers 200 only
# on the primary, /replica only on a running replica.
global
    maxconn 300

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

defaults
    mode tcp
    timeout connect 3s
    timeout client 30m
    timeout server 30m
    timeout check 2s
    # A node that stops answering is marked down after two checks, and the
    # connections still open to it are closed, so no service keeps writing
    # to a primary that was demoted. A node not running yet is resolved later.
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none

# 5432: the primary, reads and writes. The service's only port.
listen primary
    bind :5432
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    server node-1 "${CLUSTER}-1:5432" check port 8008
    server node-2 "${CLUSTER}-2:5432" check port 8008
    server node-3 "${CLUSTER}-3:5432" check port 8008

# 5433: the replicas, read only, in turn. Only the ETL connects here.
listen replicas
    bind :5433
    balance roundrobin
    option httpchk
    http-check send meth GET uri /replica
    http-check expect status 200
    server node-1 "${CLUSTER}-1:5432" check port 8008
    server node-2 "${CLUSTER}-2:5432" check port 8008
    server node-3 "${CLUSTER}-3:5432" check port 8008
