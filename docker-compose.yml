# Runs the system from explicit image versions published on Docker Hub.
# REST is published only by Gateway; Session and Discord DMs publish only their
# WebSocket listeners.
# See docs/gateway-integration.md for image readiness and remaining dependencies.
#
# Every service owns its own PostgreSQL database, which only that service can
# reach: the databases publish no ports and sit on the service's own network.
#
# Before the first `docker compose up`:
#   1. cp .env.example .env, and fill in every value
#   2. generate the RS256 keypairs the two token issuers sign with:
#        mkdir -p keys/player keys/session
#        openssl genrsa -out keys/player/private.pem 2048
#        openssl rsa -in keys/player/private.pem -pubout -out keys/player/public.pem
#        openssl genrsa -out keys/session/private.pem 2048
#        openssl rsa -in keys/session/private.pem -pubout -out keys/session/public.pem
#
# Database schemas live in db/<service>/ and run on the first start of an
# empty volume.

name: pad-team-20

services:
  gateway:
    image: ${GATEWAY_IMAGE:?set GATEWAY_IMAGE to a published Gateway repository:tag}
    environment:
      BROKER_SERVICES: "rules,records"
      PLAYER_BASE_URL: http://player:3000
      SESSION_BASE_URL: http://session:3001
      APPLICANT_BASE_URL: http://applicant:80
      CREDENTIAL_BASE_URL: http://credential:80
      RULES_BASE_URL: http://server-rules:80
      RECORDS_BASE_URL: http://university-record:80
      MODERATION_BASE_URL: http://moderation-service:3000
      DM_BASE_URL: http://dm-service:3000
      PLAYER_PUBLIC_KEY_PATH: /app/keys/player-public.pem
      SESSION_PUBLIC_KEY_PATH: /app/keys/session-public.pem
      SESSION_PUBLIC_WS_BASE_URL: ${SESSION_PUBLIC_WS_BASE_URL:-ws://127.0.0.1:${SESSION_WS_PORT:-3011}}
      DM_PUBLIC_WS_BASE_URL: ${DM_PUBLIC_WS_BASE_URL:-ws://127.0.0.1:${DM_WS_PORT:-3002}}
      REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-10}
      MAX_CONCURRENT_REQUESTS: ${GATEWAY_MAX_CONCURRENT_REQUESTS:-100}
      MAX_CONCURRENT_INTERNAL_REQUESTS: ${GATEWAY_MAX_CONCURRENT_INTERNAL_REQUESTS:-100}
    volumes:
      - ${PAD_KEYS_DIR:-./keys}/player/public.pem:/app/keys/player-public.pem:ro
      - ${PAD_KEYS_DIR:-./keys}/session/public.pem:/app/keys/session-public.pem:ro
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:8000"
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/up', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---- Service Discovery ----
  # Every service instance registers here on startup; Gateway reads the
  # registry to spread requests across the instances of each service.
  service-discovery:
    image: ${SERVICE_DISCOVERY_IMAGE:-georgerabus/pad-service-discovery:4.0.0-rc.2}
    environment:
      # An instance is called critical at this share of its own limit, and the
      # alert is logged. With a webhook set it is also sent there; unset, the
      # log is the only record.
      LOAD_CRITICAL_RATIO: ${LOAD_CRITICAL_RATIO:-0.8}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # The operator token for GET /logs/all, which collects every instance's
      # logs. Unset, that endpoint refuses every request: the collected lines
      # carry what no player may see, such as which applicant is an impostor.
      LOGS_TOKEN: ${LOGS_TOKEN:-}
      # The Gateway does not register itself, so its lines are only collected
      # if it is named here.
      LOGS_EXTRA_INSTANCES: ${LOGS_EXTRA_INSTANCES:-gateway=http://gateway:8000}
      # For the same reason, on the metrics side: the Gateway is the front
      # door every client request passes through, so leaving it off the
      # dashboard would hide the busiest component in the system. Watched
      # only — nothing here puts it in the registry.
      METRICS_EXTRA_INSTANCES: ${METRICS_EXTRA_INSTANCES:-gateway=http://gateway:8000}
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/status', timeout=2)"]
      # Every check is a logged request, so not more often than this.
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---- Message Broker ----
  # Carries messages between the services: a request is delivered to one
  # instance of the service it names, found through Service Discovery. Reached
  # at http://broker:8000 inside the network, and for gRPC calls between
  # services at broker:9001; it publishes no port. It
  # registers itself with Service Discovery and retries until it answers, so
  # it needs no start order.
  broker:
    image: ${BROKER_IMAGE:-augustinploteanu/pad-message-broker:4.0.0-rc.5}
    environment:
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
      MAX_CONCURRENT_REQUESTS: ${BROKER_MAX_CONCURRENT_REQUESTS:-100}
      DEFAULT_TIMEOUT_SECONDS: ${BROKER_DEFAULT_TIMEOUT_SECONDS:-10}
    # Queued events are kept in /data/queues.db until delivered, so they
    # survive the broker restarting. Images before the durable queues ignore it.
    volumes:
      - broker-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/status', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---- Player Service ----
  player-db:
    image: postgres:17
    environment:
      POSTGRES_DB: player
      POSTGRES_USER: player
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD:?set PLAYER_DB_PASSWORD in .env}
    volumes:
      - player-db-data:/var/lib/postgresql/data
      - ./db/player:/docker-entrypoint-initdb.d:ro
    networks: [player]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U player -d player"]
      # Fresh-volume initialization can still be finishing its final checkpoint.
      start_period: 60s
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  player:
    image: ${PLAYER_IMAGE:-catalinasiminiuc/pad-player-service:4.0.0-rc.2}
    depends_on:
      player-db:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      SESSION_BASE_URL: http://gateway:8001/session
      # Every replica registers here on startup as http://$HOSTNAME:3000.
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
      DB_HOST: player-db
      DB_PORT: 5432
      DB_NAME: player
      DB_USER: player
      DB_PASSWORD: ${PLAYER_DB_PASSWORD:?set PLAYER_DB_PASSWORD in .env}
    volumes:
      - ${PAD_KEYS_DIR:-./keys}/player:/app/keys:ro
    deploy:
      replicas: ${PLAYER_REPLICAS:-2}
    healthcheck:
      # Exempt from the request limit, so a busy instance still answers.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [player, backend]
    restart: unless-stopped

  # ---- Server Moderation Session Service ----
  session-db:
    image: postgres:17
    environment:
      POSTGRES_DB: session
      POSTGRES_USER: session
      POSTGRES_PASSWORD: ${SESSION_DB_PASSWORD:?set SESSION_DB_PASSWORD in .env}
    volumes:
      - session-db-data:/var/lib/postgresql/data
      - ./db/session:/docker-entrypoint-initdb.d:ro
    networks: [session]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U session -d session"]
      start_period: 60s
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  session:
    image: ${SESSION_IMAGE:-catalinasiminiuc/pad-server-moderation-session-service:4.0.0-rc.2}
    depends_on:
      session-db:
        condition: service_healthy
    environment:
      # REST, reachable only through the Gateway: this port is not published.
      PORT: 3001
      # WS /sessions/{id}/live, on a listener of its own. It serves protocol
      # upgrades and answers 426 to anything else, so publishing it exposes
      # the socket without exposing a single REST route.
      WS_PORT: 3011
      SESSION_JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      SESSION_JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      # The services Session calls, through the Gateway's internal listener.
      # Marked internal in the contract, so reachable there only. None of the
      # four is read any more: Applicant is asked through the broker,
      # Moderation and Server Rules over gRPC through it. They stay until the
      # routes are removed from the Gateway, so that setting the transport
      # below back to `http` is enough to fall back.
      PLAYER_BASE_URL: http://gateway:8001/player
      APPLICANT_BASE_URL: http://gateway:8001/applicant
      SERVER_RULES_BASE_URL: http://gateway:8001/rules
      MODERATION_BASE_URL: http://gateway:8001/moderation
      # How Session calls Server Rules: `grpc` for
      # /pad.rules.v1.Rules/CreateRuleSet through the broker, or `http` for
      # SERVER_RULES_BASE_URL above. Verified over gRPC on 2026-11-13 — a
      # shift opened on rule set 16174, well inside the 4s deadline — so gRPC
      # is the default now, and `http` is what to set if the broker or Server
      # Rules has to be taken out of the path.
      SERVER_RULES_TRANSPORT: ${SERVER_RULES_TRANSPORT:-grpc}
      # Every replica registers here on startup as http://$HOSTNAME:3001.
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
      DB_HOST: session-db
      DB_PORT: 5432
      DB_NAME: session
      DB_USER: session
      DB_PASSWORD: ${SESSION_DB_PASSWORD:?set SESSION_DB_PASSWORD in .env}
    volumes:
      - ${PAD_KEYS_DIR:-./keys}/session:/app/keys:ro
    healthcheck:
      # Exempt from the request limit, so a busy instance still answers.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      replicas: ${SESSION_REPLICAS:-2}
    # One published port per replica, taken from the range in order, so the
    # range must hold at least SESSION_REPLICAS ports. Live events reach the
    # watchers of every replica through the database, so the address
    # /ws/negotiate hands out, the first port, serves all of them.
    ports:
      - "127.0.0.1:${SESSION_WS_PORT:-3011}-${SESSION_WS_PORT_LAST:-3013}:3011"
    networks: [session, backend]
    restart: unless-stopped

  # ---- Discord DMs Service ----
  dm-db:
    image: postgres:17
    environment:
      POSTGRES_DB: dm
      POSTGRES_USER: dm
      POSTGRES_PASSWORD: ${DM_DB_PASSWORD:?set DM_DB_PASSWORD in .env}
    volumes:
      - dm-db-data:/var/lib/postgresql/data
      - ./db/dm:/docker-entrypoint-initdb.d:ro
    networks: [dm]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dm -d dm"]
      start_period: 60s
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  dm-service:
    image: ${DM_IMAGE:-augustinploteanu/pad-dm-service:4.3.0}
    depends_on:
      dm-db:
        condition: service_healthy
    environment:
      PORT: 3000
      # WS /ws?sessionId=&token=, on a listener of its own. It serves upgrades
      # to /ws and nothing else (426 to ordinary HTTP); REST stays on 3000,
      # reachable only through Gateway.
      WS_PORT: 3001
      DB_HOST: dm-db
      DB_PORT: 5432
      DB_NAME: dm
      DB_USER: dm
      DB_PASSWORD: ${DM_DB_PASSWORD:?set DM_DB_PASSWORD in .env}
      SESSION_JWT_PUBLIC_KEY_PATH: /app/keys/session-public.pem
      SESSION_URL: http://gateway:8001/session
      CREDENTIAL_URL: http://gateway:8001/credential
      UNIVERSITY_RECORD_URL: http://gateway:8001/records
      # Shared records are read with University Record's
      # /pad.records.v1.Records/GetRecord through the broker instead of the
      # REST call above. Needs a University Record image from 4.0.0-rc.1 on.
      # DM_RECORDS_GRPC_ADDRESS overrides the address; set it empty to fall
      # back to REST.
      RECORDS_GRPC_ADDRESS: ${DM_RECORDS_GRPC_ADDRESS-broker:9001}
      # Every replica registers here on startup as http://$HOSTNAME:3000.
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
    volumes:
      - ${PAD_KEYS_DIR:-./keys}/session/public.pem:/app/keys/session-public.pem:ro
    deploy:
      replicas: ${DM_REPLICAS:-2}
    # One host port per replica, taken from the range in order, so the range
    # must hold at least DM_REPLICAS ports. Every replica serves every channel
    # (they share messages and presence through dm-db), so the address
    # /ws/negotiate hands out, the first port, reaches all of them.
    ports:
      - "127.0.0.1:${DM_WS_PORT:-3002}-${DM_WS_PORT_LAST:-3004}:3001"
    networks: [dm, backend]
    # Exempt from the request limit, so a busy replica still answers.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---- Moderation Service ----
  moderation-db:
    image: postgres:17
    environment:
      POSTGRES_DB: moderation
      POSTGRES_USER: moderation
      POSTGRES_PASSWORD: ${MODERATION_DB_PASSWORD:?set MODERATION_DB_PASSWORD in .env}
    volumes:
      - moderation-db-data:/var/lib/postgresql/data
      - ./db/moderation:/docker-entrypoint-initdb.d:ro
    networks: [moderation]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U moderation -d moderation"]
      start_period: 60s
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  moderation-service:
    image: ${MODERATION_IMAGE:-augustinploteanu/pad-moderation-service:4.3.0}
    depends_on:
      moderation-db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: moderation-db
      DB_PORT: 5432
      DB_NAME: moderation
      DB_USER: moderation
      DB_PASSWORD: ${MODERATION_DB_PASSWORD:?set MODERATION_DB_PASSWORD in .env}
      APPLICANT_URL: http://gateway:8001/applicant
      CREDENTIAL_URL: http://gateway:8001/credential
      SERVER_RULES_URL: http://gateway:8001/rules
      SESSION_URL: http://gateway:8001/session
      # Evaluate and GetCurrentRuleSet go to /pad.rules.v1.Rules through the
      # broker instead of SERVER_RULES_URL above. Needs a Server Rules image
      # from 4.0.0-rc.3 on; remove it to fall back to REST.
      SERVER_RULES_GRPC_ADDRESS: broker:9001
      # Every replica registers here on startup as http://$HOSTNAME:3000.
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
    deploy:
      replicas: ${MODERATION_REPLICAS:-2}
    networks: [moderation, backend]
    # Exempt from the request limit, so a busy replica still answers.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server-rules-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: server_rules
      POSTGRES_USER: server_rules
      POSTGRES_PASSWORD: ${SERVER_RULES_DB_PASSWORD:?Set SERVER_RULES_DB_PASSWORD in .env}
    volumes:
      - server-rules-db-data:/var/lib/postgresql/data
      - ./db/server-rules:/docker-entrypoint-initdb.d:ro
    networks: [server-rules]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U server_rules -d server_rules"]
      start_period: 60s
      interval: 3s
      timeout: 3s
      retries: 20
  server-rules:
    image: ${SERVER_RULES_IMAGE:?set SERVER_RULES_IMAGE to a Gateway-compatible repository:tag}
    environment:
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
      SD_SERVICE_NAME: rules
      SD_REGISTER_INTERVAL_SECONDS: ${SD_REGISTER_INTERVAL_SECONDS:-30}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${SERVER_RULES_APP_KEY:?Set SERVER_RULES_APP_KEY in .env}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: server-rules-db
      DB_PORT: 5432
      DB_DATABASE: server_rules
      DB_USERNAME: server_rules
      DB_PASSWORD: ${SERVER_RULES_DB_PASSWORD:?Set SERVER_RULES_DB_PASSWORD in .env}
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      server-rules-db:
        condition: service_healthy
    deploy:
      replicas: ${SERVER_RULES_REPLICAS:-2}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/status') === false ? 1 : 0);"]
      start_period: 60s
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [server-rules, backend]
  university-record-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: university_record
      POSTGRES_USER: university_record
      POSTGRES_PASSWORD: ${UNIVERSITY_RECORD_DB_PASSWORD:?Set UNIVERSITY_RECORD_DB_PASSWORD in .env}
    volumes:
      - university-record-db-data:/var/lib/postgresql/data
      - ./db/university-record:/docker-entrypoint-initdb.d:ro
    networks: [university-record]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U university_record -d university_record"]
      start_period: 60s
      interval: 3s
      timeout: 3s
      retries: 20
  university-record:
    image: ${UNIVERSITY_RECORD_IMAGE:?set UNIVERSITY_RECORD_IMAGE to a Gateway-compatible repository:tag}
    environment:
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
      SD_SERVICE_NAME: records
      SD_REGISTER_INTERVAL_SECONDS: ${SD_REGISTER_INTERVAL_SECONDS:-30}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${UNIVERSITY_RECORD_APP_KEY:?Set UNIVERSITY_RECORD_APP_KEY in .env}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: university-record-db
      DB_PORT: 5432
      DB_DATABASE: university_record
      DB_USERNAME: university_record
      DB_PASSWORD: ${UNIVERSITY_RECORD_DB_PASSWORD:?Set UNIVERSITY_RECORD_DB_PASSWORD in .env}
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      university-record-db:
        condition: service_healthy
    deploy:
      replicas: ${UNIVERSITY_RECORD_REPLICAS:-2}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/status') === false ? 1 : 0);"]
      start_period: 60s
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [university-record, backend]

  # ---- Applicant Service ----
  applicant-db:
    image: postgres:17
    environment:
      POSTGRES_DB: applicant
      POSTGRES_USER: applicant
      POSTGRES_PASSWORD: ${APPLICANT_DB_PASSWORD:?set APPLICANT_DB_PASSWORD in .env}
    volumes:
      - applicant-db-data:/var/lib/postgresql/data
      - ./db/applicant:/docker-entrypoint-initdb.d:ro
    networks: [applicant]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U applicant -d applicant"]
      start_period: 60s
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  applicant:
    image: ${APPLICANT_IMAGE:-georgerabus/pad-applicant-service:4.0.0-rc.2}
    depends_on:
      applicant-db:
        condition: service_healthy
    environment:
      DB_HOST: applicant-db
      DB_DATABASE: applicant
      DB_USERNAME: applicant
      DB_PASSWORD: ${APPLICANT_DB_PASSWORD:?set APPLICANT_DB_PASSWORD in .env}
      # A new applicant's story is handed over to each target by a gRPC call
      # through the broker, named as the target registers with Service
      # Discovery: records is /pad.records.v1.Records/CreateApplicant (#61).
      HANDOVER_TARGETS: credential,records
      BROKER_GRPC_ADDRESS: broker:9001
      # Every replica registers here on startup as http://$HOSTNAME:80.
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
    deploy:
      replicas: ${APPLICANT_REPLICAS:-2}
    networks: [applicant, backend]
    restart: unless-stopped

  # ---- Credential Service ----
  credential-db:
    image: postgres:17
    environment:
      POSTGRES_DB: credential
      POSTGRES_USER: credential
      POSTGRES_PASSWORD: ${CREDENTIAL_DB_PASSWORD:?set CREDENTIAL_DB_PASSWORD in .env}
    volumes:
      - credential-db-data:/var/lib/postgresql/data
      - ./db/credential:/docker-entrypoint-initdb.d:ro
    networks: [credential]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U credential -d credential"]
      start_period: 60s
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  credential:
    image: ${CREDENTIAL_IMAGE:-georgerabus/pad-credential-service:4.0.0-rc.2}
    depends_on:
      credential-db:
        condition: service_healthy
    environment:
      DB_HOST: credential-db
      DB_DATABASE: credential
      DB_USERNAME: credential
      DB_PASSWORD: ${CREDENTIAL_DB_PASSWORD:?set CREDENTIAL_DB_PASSWORD in .env}
      CREDENTIAL_ISSUER_SECRET: ${CREDENTIAL_ISSUER_SECRET:?set CREDENTIAL_ISSUER_SECRET in .env}
      # The same hand-over, to Applicant and University Record, when
      # Credential is the one that starts an applicant.
      HANDOVER_TARGETS: applicant,records
      BROKER_GRPC_ADDRESS: broker:9001
      # Every replica registers here on startup as http://$HOSTNAME:80.
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
    deploy:
      replicas: ${CREDENTIAL_REPLICAS:-2}
    networks: [credential, backend]
    restart: unless-stopped

  # ---- Monitoring ----
  # Behind the `monitoring` profile, so `docker compose up` starts the system
  # as it always has and nobody pays for four more containers they did not
  # ask for. Start them with:
  #
  #     docker compose --profile monitoring up -d
  #
  # Grafana is then at http://localhost:3300, with the dashboard already
  # loaded and both data sources already connected.

  # Collects the numbers. One target for the whole system: Service Discovery
  # serves what every instance last reported at GET /metrics, so no service
  # has a metrics endpoint of its own to maintain.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Long enough to look back over a demonstration, short enough that the
      # volume does not grow without anyone noticing.
      - --storage.tsdb.retention.time=48h
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [backend]
    restart: unless-stopped

  # Holds the lines. One process, filesystem storage: this watches eleven
  # services on one machine, and a clustered log store would be more moving
  # parts than the thing being monitored.
  loki:
    image: grafana/loki:3.3.2
    profiles: [monitoring]
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks: [backend]
    restart: unless-stopped

  # Ships every container's output to Loki. Containers are discovered through
  # the Docker API rather than listed, so a replica started with
  # `--scale player=4` is collected from without any config change.
  promtail:
    image: grafana/promtail:3.3.2
    profiles: [monitoring]
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Read-only, and only ever used to list containers and read their
      # output. Nothing here starts, stops or changes a container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/promtail
    depends_on: [loki]
    networks: [backend]
    restart: unless-stopped

  # Draws it. The dashboard and both data sources are provisioned from files
  # in this repository, so the stack comes up with them already there instead
  # of someone clicking them together before a demonstration.
  grafana:
    image: grafana/grafana:11.4.0
    profiles: [monitoring]
    environment:
      # A dashboard of counts and container names, on a developer's own
      # machine. A login would be one more thing to remember and nothing
      # here is worth protecting; the port is bound to the loopback address
      # either way.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      # Opens on the system overview rather than on an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pad-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      # The two subdirectories, not the whole provisioning folder: mounting
      # over it would hide the empty `alerting` and `plugins` directories the
      # image ships, and Grafana logs an error for each one it cannot find.
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Not 3000: the NestJS services already use it inside the network, and
      # it is the port most likely to be taken on a developer's machine.
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    depends_on: [prometheus, loki]
    networks: [backend]
    restart: unless-stopped

# One private network per service for its database, and a shared one the
# services use to reach each other.
networks:
  applicant:
  credential:
  server-rules:
  university-record:
  backend:
  player:
  session:
  dm:
  moderation:

volumes:
  broker-data:
  applicant-db-data:
  credential-db-data:
  server-rules-db-data:
  university-record-db-data:
  player-db-data:
  session-db-data:
  dm-db-data:
  moderation-db-data:
  prometheus-data:
  loki-data:
  promtail-data:
  grafana-data:
