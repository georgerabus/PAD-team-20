# Runs the system from explicit image versions published on Docker Hub.
# REST is published only by Gateway; Session and Discord DMs publish only their
# WebSocket listeners.
# See docs/gateway-integration.md for image readiness and remaining dependencies.
#
# Every service owns its own PostgreSQL database, which only that service can
# reach: the databases publish no ports and sit on the service's own network.
#
# Before the first `docker compose up`:
#   1. cp .env.example .env, and fill in every value
#   2. generate the RS256 keypairs the two token issuers sign with:
#        mkdir -p keys/player keys/session
#        openssl genrsa -out keys/player/private.pem 2048
#        openssl rsa -in keys/player/private.pem -pubout -out keys/player/public.pem
#        openssl genrsa -out keys/session/private.pem 2048
#        openssl rsa -in keys/session/private.pem -pubout -out keys/session/public.pem
#
# Database schemas live in db/<service>/ and run once, when a database's
# cluster is created.

name: pad-team-20

# Every database is a cluster of three PostgreSQL 17 nodes run by Patroni (one
# primary, two replicas), which elect the primary through the three etcd nodes
# below, shared by every cluster. The database host name a service already
# uses belongs to an HAProxy in front of its cluster. See docker/postgres-ha/
# and the CPR README, "Replicated databases".
x-postgres-ha-node: &postgres-ha-node
  image: ${POSTGRES_HA_IMAGE:-georgerabus/pad-postgres-ha:1.0.1}
  depends_on: [etcd-1, etcd-2, etcd-3]
  healthcheck:
    test: [CMD, pg_isready, -h, 127.0.0.1, -p, "5432"]
    # The first start creates the cluster: initdb, then each replica copies the primary.
    start_period: 300s
    interval: 3s
    timeout: 3s
    retries: 20
  restart: unless-stopped

x-postgres-ha-proxy: &postgres-ha-proxy
  image: ${POSTGRES_HA_IMAGE:-georgerabus/pad-postgres-ha:1.0.1}
  entrypoint: [haproxy, -db, -f, /etc/haproxy/pad.cfg]
  # Healthy once the primary answers through it, in the service's database.
  healthcheck:
    test: [CMD, psql, -h, 127.0.0.1, -X, -Atc, "select 1"]
    start_period: 300s
    interval: 3s
    timeout: 3s
    retries: 20
  restart: unless-stopped

x-etcd: &etcd
  image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.6.16}
  networks: [dcs]
  healthcheck:
    test: [CMD, etcdctl, endpoint, health]
    interval: 3s
    timeout: 3s
    retries: 20
  restart: unless-stopped

x-etcd-environment: &etcd-environment
  ETCD_DATA_DIR: /etcd-data
  ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
  ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
  ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
  ETCD_INITIAL_CLUSTER_STATE: new
  ETCD_INITIAL_CLUSTER_TOKEN: pad-team-20

# The Gateway's cache: three Valkey nodes, which the Gateway shards itself by a
# consistent-hashing ring. They keep nothing on disk (/data is a tmpfs, so no
# volume is left behind either) and evict the least recently used keys when
# full: losing a node loses only cache. Only the Gateway reaches them, on the
# cache network. See the CPR README, "Cache".
x-valkey: &valkey
  image: ${VALKEY_IMAGE:-valkey/valkey:8.1.4-alpine}
  command: [valkey-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
  tmpfs: [/data]
  networks: [cache]
  healthcheck:
    test: [CMD, valkey-cli, ping]
    interval: 5s
    timeout: 3s
    retries: 5
  restart: unless-stopped

services:
  # ---- etcd: where every Patroni cluster keeps its leader lock ----
  etcd-1:
    <<: *etcd
    environment:
      <<: *etcd-environment
      ETCD_NAME: etcd-1
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-1:2380
    volumes: [etcd-1-data:/etcd-data]
  etcd-2:
    <<: *etcd
    environment:
      <<: *etcd-environment
      ETCD_NAME: etcd-2
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-2:2380
    volumes: [etcd-2-data:/etcd-data]
  etcd-3:
    <<: *etcd
    environment:
      <<: *etcd-environment
      ETCD_NAME: etcd-3
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-3:2380
    volumes: [etcd-3-data:/etcd-data]

  # ---- Valkey: the Gateway's cache ----
  valkey-1: *valkey
  valkey-2: *valkey
  valkey-3: *valkey

  gateway:
    image: ${GATEWAY_IMAGE:?set GATEWAY_IMAGE to a published Gateway repository:tag}
    environment:
      BROKER_SERVICES: "rules,records,dm,moderation"
      PLAYER_BASE_URL: http://player:3000
      SESSION_BASE_URL: http://session:3001
      APPLICANT_BASE_URL: http://applicant:80
      CREDENTIAL_BASE_URL: http://credential:80
      RULES_BASE_URL: http://server-rules:80
      RECORDS_BASE_URL: http://university-record:80
      MODERATION_BASE_URL: http://moderation-service:3000
      DM_BASE_URL: http://dm-service:3000
      PLAYER_PUBLIC_KEY_PATH: /app/keys/player-public.pem
      SESSION_PUBLIC_KEY_PATH: /app/keys/session-public.pem
      SESSION_PUBLIC_WS_BASE_URL: ${SESSION_PUBLIC_WS_BASE_URL:-ws://127.0.0.1:${SESSION_WS_PORT:-3011}}
      DM_PUBLIC_WS_BASE_URL: ${DM_PUBLIC_WS_BASE_URL:-ws://127.0.0.1:${DM_WS_PORT:-3002}}
      REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-10}
      MAX_CONCURRENT_REQUESTS: ${GATEWAY_MAX_CONCURRENT_REQUESTS:-100}
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
      # The cache. The Gateway does not wait for these nodes: one that does not
      # answer only leaves its ring, and requests go to the services.
      VALKEY_NODES: valkey-1:6379,valkey-2:6379,valkey-3:6379
      # GET /logs on the public port is the whole system's log, read from
      # Loki. It takes this operator token in X-Logs-Token rather than a
      # player's: the lines carry what no player may see, such as which
      # applicant is an impostor. Unset, it refuses every request.
      LOGS_TOKEN: ${LOGS_TOKEN:-}
      LOKI_URL: http://loki:3100
      # Where spans go: Tempo, started with the monitoring profile. Empty, trace
      # ids are still made, passed on and logged; only the export is off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ${PAD_KEYS_DIR:-./keys}/player/public.pem:/app/keys/player-public.pem:ro
      - ${PAD_KEYS_DIR:-./keys}/session/public.pem:/app/keys/session-public.pem:ro
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:8000"
    networks: [backend, cache]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/up', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---- Service Discovery ----
  # Every service instance registers here on startup; Gateway reads the
  # registry to spread requests across the instances of each service.
  service-discovery:
    image: ${SERVICE_DISCOVERY_IMAGE:-georgerabus/pad-service-discovery:4.0.0}
    environment:
      # An instance is called critical at this share of its own limit, and the
      # alert is logged. With a webhook set it is also sent there; unset, the
      # log is the only record.
      LOAD_CRITICAL_RATIO: ${LOAD_CRITICAL_RATIO:-0.8}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # The Gateway does not register itself, so it is named here to be on the
      # dashboard: it is the front door every client request passes through,
      # and leaving it off the
      # dashboard would hide the busiest component in the system. Watched
      # only — nothing here puts it in the registry.
      METRICS_EXTRA_INSTANCES: ${METRICS_EXTRA_INSTANCES:-gateway=http://gateway:8000}
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/status', timeout=2)"]
      # Every check is a logged request, so not more often than this.
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---- Message Broker ----
  # Carries messages between the services: a request is delivered to one
  # instance of the service it names, found through Service Discovery. Reached
  # at http://broker:8000 inside the network, and for gRPC calls between
  # services at broker:9001; it publishes no port. It
  # registers itself with Service Discovery and retries until it answers, so
  # it needs no start order.
  broker:
    image: ${BROKER_IMAGE:-georgerabus/pad-message-broker:5.0.0-rc.1}
    environment:
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
      MAX_CONCURRENT_REQUESTS: ${BROKER_MAX_CONCURRENT_REQUESTS:-100}
      DEFAULT_TIMEOUT_SECONDS: ${BROKER_DEFAULT_TIMEOUT_SECONDS:-10}
      # Where the `logs` topic goes: every service's lines, sent as LogBatch
      # events, are written into Loki as source="broker". That is what the
      # Gateway's GET /logs downloads.
      LOKI_URL: http://loki:3100
      # Where spans go: Tempo, started with the monitoring profile. Empty, trace
      # ids are still made, passed on and logged; only the export is off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # Queued events are kept in /data/queues.db until delivered, so they
    # survive the broker restarting. Images before the durable queues ignore it.
    volumes:
      - broker-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/status', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---- Player Service ----
  # player-db is the HAProxy in front of the player-db-1..3 cluster: 5432 the primary, 5433 the replicas.
  player-db:
    <<: *postgres-ha-proxy
    depends_on: [player-db-1, player-db-2, player-db-3]
    environment:
      CLUSTER: player-db
      PGUSER: player
      PGDATABASE: player
      PGPASSWORD: ${PLAYER_DB_PASSWORD:?set PLAYER_DB_PASSWORD in .env}
    networks: [player]
  player-db-1:
    <<: *postgres-ha-node
    environment: &player-db-node
      PATRONI_SCOPE: player-db
      PATRONI_SUPERUSER_USERNAME: player
      PATRONI_SUPERUSER_PASSWORD: ${PLAYER_DB_PASSWORD:?set PLAYER_DB_PASSWORD in .env}
      POSTGRES_DB: player
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?set ETL_DB_PASSWORD in .env}
      PATRONI_NAME: player-db-1
    volumes: [player-db-1-data:/var/lib/postgresql/data, ./db/player:/docker-entrypoint-initdb.d:ro]
    networks: [player, dcs]
  player-db-2:
    <<: *postgres-ha-node
    environment: {<<: *player-db-node, PATRONI_NAME: player-db-2}
    volumes: [player-db-2-data:/var/lib/postgresql/data, ./db/player:/docker-entrypoint-initdb.d:ro]
    networks: [player, dcs]
  player-db-3:
    <<: *postgres-ha-node
    environment: {<<: *player-db-node, PATRONI_NAME: player-db-3}
    volumes: [player-db-3-data:/var/lib/postgresql/data, ./db/player:/docker-entrypoint-initdb.d:ro]
    networks: [player, dcs]

  player:
    image: ${PLAYER_IMAGE:-catalinasiminiuc/pad-player-service:5.0.0-rc.2}
    depends_on:
      player-db:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      # Every replica registers here on startup as http://$HOSTNAME:3000.
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
      # Where spans go: Tempo, started with the monitoring profile. Empty, trace
      # ids are still made, passed on and logged; only the export is off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DB_HOST: player-db
      DB_PORT: 5432
      DB_NAME: player
      DB_USER: player
      DB_PASSWORD: ${PLAYER_DB_PASSWORD:?set PLAYER_DB_PASSWORD in .env}
    volumes:
      - ${PAD_KEYS_DIR:-./keys}/player:/app/keys:ro
    deploy:
      replicas: ${PLAYER_REPLICAS:-2}
    healthcheck:
      # Exempt from the request limit, so a busy instance still answers.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [player, backend]
    restart: unless-stopped

  # ---- Server Moderation Session Service ----
  # session-db is the HAProxy in front of the session-db-1..3 cluster: 5432 the primary, 5433 the replicas.
  session-db:
    <<: *postgres-ha-proxy
    depends_on: [session-db-1, session-db-2, session-db-3]
    environment:
      CLUSTER: session-db
      PGUSER: session
      PGDATABASE: session
      PGPASSWORD: ${SESSION_DB_PASSWORD:?set SESSION_DB_PASSWORD in .env}
    networks: [session]
  session-db-1:
    <<: *postgres-ha-node
    environment: &session-db-node
      PATRONI_SCOPE: session-db
      PATRONI_SUPERUSER_USERNAME: session
      PATRONI_SUPERUSER_PASSWORD: ${SESSION_DB_PASSWORD:?set SESSION_DB_PASSWORD in .env}
      POSTGRES_DB: session
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?set ETL_DB_PASSWORD in .env}
      PATRONI_NAME: session-db-1
    volumes: [session-db-1-data:/var/lib/postgresql/data, ./db/session:/docker-entrypoint-initdb.d:ro]
    networks: [session, dcs]
  session-db-2:
    <<: *postgres-ha-node
    environment: {<<: *session-db-node, PATRONI_NAME: session-db-2}
    volumes: [session-db-2-data:/var/lib/postgresql/data, ./db/session:/docker-entrypoint-initdb.d:ro]
    networks: [session, dcs]
  session-db-3:
    <<: *postgres-ha-node
    environment: {<<: *session-db-node, PATRONI_NAME: session-db-3}
    volumes: [session-db-3-data:/var/lib/postgresql/data, ./db/session:/docker-entrypoint-initdb.d:ro]
    networks: [session, dcs]

  session:
    image: ${SESSION_IMAGE:-catalinasiminiuc/pad-server-moderation-session-service:5.0.0-rc.2}
    depends_on:
      session-db:
        condition: service_healthy
    environment:
      # REST, reachable only through the Gateway: this port is not published.
      PORT: 3001
      # WS /sessions/{id}/live, on a listener of its own. It serves protocol
      # upgrades and answers 426 to anything else, so publishing it exposes
      # the socket without exposing a single REST route.
      WS_PORT: 3011
      SESSION_JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      SESSION_JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      # No setting names another service: from 4.0.1 on, everything Session
      # calls goes through the Message Broker (Applicant and Player by message,
      # Server Rules and Moderation over gRPC), at its default address, and
      # the Gateway has no internal port any more. From 5.0.0 on it
      # also follows Applicant's sagas there, on GET /sagas/{id}.
      # Every replica registers here on startup as http://$HOSTNAME:3001.
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
      # Where spans go: Tempo, started with the monitoring profile. Empty, trace
      # ids are still made, passed on and logged; only the export is off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DB_HOST: session-db
      DB_PORT: 5432
      DB_NAME: session
      DB_USER: session
      DB_PASSWORD: ${SESSION_DB_PASSWORD:?set SESSION_DB_PASSWORD in .env}
    volumes:
      - ${PAD_KEYS_DIR:-./keys}/session:/app/keys:ro
    healthcheck:
      # Exempt from the request limit, so a busy instance still answers.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      replicas: ${SESSION_REPLICAS:-2}
    # One published port per replica, taken from the range in order, so the
    # range must hold at least SESSION_REPLICAS ports. Live events reach the
    # watchers of every replica through the database, so the address
    # /ws/negotiate hands out, the first port, serves all of them.
    ports:
      - "127.0.0.1:${SESSION_WS_PORT:-3011}-${SESSION_WS_PORT_LAST:-3013}:3011"
    networks: [session, backend]
    restart: unless-stopped

  # ---- Discord DMs Service ----
  # dm-db is the HAProxy in front of the dm-db-1..3 cluster: 5432 the primary, 5433 the replicas.
  dm-db:
    <<: *postgres-ha-proxy
    depends_on: [dm-db-1, dm-db-2, dm-db-3]
    environment:
      CLUSTER: dm-db
      PGUSER: dm
      PGDATABASE: dm
      PGPASSWORD: ${DM_DB_PASSWORD:?set DM_DB_PASSWORD in .env}
    networks: [dm]
  dm-db-1:
    <<: *postgres-ha-node
    environment: &dm-db-node
      PATRONI_SCOPE: dm-db
      PATRONI_SUPERUSER_USERNAME: dm
      PATRONI_SUPERUSER_PASSWORD: ${DM_DB_PASSWORD:?set DM_DB_PASSWORD in .env}
      POSTGRES_DB: dm
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?set ETL_DB_PASSWORD in .env}
      PATRONI_NAME: dm-db-1
    volumes: [dm-db-1-data:/var/lib/postgresql/data, ./db/dm:/docker-entrypoint-initdb.d:ro]
    networks: [dm, dcs]
  dm-db-2:
    <<: *postgres-ha-node
    environment: {<<: *dm-db-node, PATRONI_NAME: dm-db-2}
    volumes: [dm-db-2-data:/var/lib/postgresql/data, ./db/dm:/docker-entrypoint-initdb.d:ro]
    networks: [dm, dcs]
  dm-db-3:
    <<: *postgres-ha-node
    environment: {<<: *dm-db-node, PATRONI_NAME: dm-db-3}
    volumes: [dm-db-3-data:/var/lib/postgresql/data, ./db/dm:/docker-entrypoint-initdb.d:ro]
    networks: [dm, dcs]

  dm-service:
    image: ${DM_IMAGE:-augustinploteanu/pad-dm-service:5.0.0-rc.1}
    depends_on:
      dm-db:
        condition: service_healthy
    environment:
      PORT: 3000
      # WS /ws?sessionId=&token=, on a listener of its own. It serves upgrades
      # to /ws and nothing else (426 to ordinary HTTP); REST stays on 3000,
      # reachable only through Gateway.
      WS_PORT: 3001
      DB_HOST: dm-db
      DB_PORT: 5432
      DB_NAME: dm
      DB_USER: dm
      DB_PASSWORD: ${DM_DB_PASSWORD:?set DM_DB_PASSWORD in .env}
      SESSION_JWT_PUBLIC_KEY_PATH: /app/keys/session-public.pem
      # Every call to another service goes through the broker over gRPC:
      # shared records (University Record's GetRecord), shared documents
      # (Credential's GetCredential) and channel access (Session's
      # CheckChannelAccess). The REST fallback through the Gateway's internal
      # port went with that port; the DM_*_GRPC_ADDRESS variables still move
      # each call to another address.
      RECORDS_GRPC_ADDRESS: ${DM_RECORDS_GRPC_ADDRESS-broker:9001}
      CREDENTIAL_GRPC_ADDRESS: ${DM_CREDENTIAL_GRPC_ADDRESS-broker:9001}
      SESSION_GRPC_ADDRESS: ${DM_SESSION_GRPC_ADDRESS-broker:9001}
      # Log lines go to the broker (topic logs, then Loki) on their own;
      # spans go to Tempo. See docs/logging-and-tracing.md.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Every replica registers here on startup as http://$HOSTNAME:3000.
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
    volumes:
      - ${PAD_KEYS_DIR:-./keys}/session/public.pem:/app/keys/session-public.pem:ro
    deploy:
      replicas: ${DM_REPLICAS:-2}
    # One host port per replica, taken from the range in order, so the range
    # must hold at least DM_REPLICAS ports. Every replica serves every channel
    # (they share messages and presence through dm-db), so the address
    # /ws/negotiate hands out, the first port, reaches all of them.
    ports:
      - "127.0.0.1:${DM_WS_PORT:-3002}-${DM_WS_PORT_LAST:-3004}:3001"
    networks: [dm, backend]
    # Exempt from the request limit, so a busy replica still answers.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---- Moderation Service ----
  # moderation-db is the HAProxy in front of the moderation-db-1..3 cluster: 5432 the primary, 5433 the replicas.
  moderation-db:
    <<: *postgres-ha-proxy
    depends_on: [moderation-db-1, moderation-db-2, moderation-db-3]
    environment:
      CLUSTER: moderation-db
      PGUSER: moderation
      PGDATABASE: moderation
      PGPASSWORD: ${MODERATION_DB_PASSWORD:?set MODERATION_DB_PASSWORD in .env}
    networks: [moderation]
  moderation-db-1:
    <<: *postgres-ha-node
    environment: &moderation-db-node
      PATRONI_SCOPE: moderation-db
      PATRONI_SUPERUSER_USERNAME: moderation
      PATRONI_SUPERUSER_PASSWORD: ${MODERATION_DB_PASSWORD:?set MODERATION_DB_PASSWORD in .env}
      POSTGRES_DB: moderation
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?set ETL_DB_PASSWORD in .env}
      PATRONI_NAME: moderation-db-1
    volumes: [moderation-db-1-data:/var/lib/postgresql/data, ./db/moderation:/docker-entrypoint-initdb.d:ro]
    networks: [moderation, dcs]
  moderation-db-2:
    <<: *postgres-ha-node
    environment: {<<: *moderation-db-node, PATRONI_NAME: moderation-db-2}
    volumes: [moderation-db-2-data:/var/lib/postgresql/data, ./db/moderation:/docker-entrypoint-initdb.d:ro]
    networks: [moderation, dcs]
  moderation-db-3:
    <<: *postgres-ha-node
    environment: {<<: *moderation-db-node, PATRONI_NAME: moderation-db-3}
    volumes: [moderation-db-3-data:/var/lib/postgresql/data, ./db/moderation:/docker-entrypoint-initdb.d:ro]
    networks: [moderation, dcs]

  moderation-service:
    image: ${MODERATION_IMAGE:-augustinploteanu/pad-moderation-service:5.0.0-rc.1}
    depends_on:
      moderation-db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: moderation-db
      DB_PORT: 5432
      DB_NAME: moderation
      DB_USER: moderation
      DB_PASSWORD: ${MODERATION_DB_PASSWORD:?set MODERATION_DB_PASSWORD in .env}
      # Every call to another service goes through the broker over gRPC:
      # Server Rules' GetCurrentRuleSet and Evaluate, Applicant's GetApplicant,
      # Credential's ValidateCredentials and Session's ReportOutcome. The REST
      # fallback through the Gateway's internal port went with that port.
      SERVER_RULES_GRPC_ADDRESS: broker:9001
      APPLICANT_GRPC_ADDRESS: broker:9001
      CREDENTIAL_GRPC_ADDRESS: broker:9001
      SESSION_GRPC_ADDRESS: broker:9001
      # Log lines go to the broker (topic logs, then Loki) on their own;
      # spans go to Tempo. See docs/logging-and-tracing.md.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Every replica registers here on startup as http://$HOSTNAME:3000.
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
    deploy:
      replicas: ${MODERATION_REPLICAS:-2}
    networks: [moderation, backend]
    # Exempt from the request limit, so a busy replica still answers.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/status', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # server-rules-db is the HAProxy in front of the server-rules-db-1..3 cluster: 5432 the primary, 5433 the replicas.
  server-rules-db:
    <<: *postgres-ha-proxy
    depends_on: [server-rules-db-1, server-rules-db-2, server-rules-db-3]
    environment:
      CLUSTER: server-rules-db
      PGUSER: server_rules
      PGDATABASE: server_rules
      PGPASSWORD: ${SERVER_RULES_DB_PASSWORD:?Set SERVER_RULES_DB_PASSWORD in .env}
    networks: [server-rules]
  server-rules-db-1:
    <<: *postgres-ha-node
    environment: &server-rules-db-node
      PATRONI_SCOPE: server-rules-db
      PATRONI_SUPERUSER_USERNAME: server_rules
      PATRONI_SUPERUSER_PASSWORD: ${SERVER_RULES_DB_PASSWORD:?Set SERVER_RULES_DB_PASSWORD in .env}
      POSTGRES_DB: server_rules
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?set ETL_DB_PASSWORD in .env}
      PATRONI_NAME: server-rules-db-1
    volumes: [server-rules-db-1-data:/var/lib/postgresql/data, ./db/server-rules:/docker-entrypoint-initdb.d:ro]
    networks: [server-rules, dcs]
  server-rules-db-2:
    <<: *postgres-ha-node
    environment: {<<: *server-rules-db-node, PATRONI_NAME: server-rules-db-2}
    volumes: [server-rules-db-2-data:/var/lib/postgresql/data, ./db/server-rules:/docker-entrypoint-initdb.d:ro]
    networks: [server-rules, dcs]
  server-rules-db-3:
    <<: *postgres-ha-node
    environment: {<<: *server-rules-db-node, PATRONI_NAME: server-rules-db-3}
    volumes: [server-rules-db-3-data:/var/lib/postgresql/data, ./db/server-rules:/docker-entrypoint-initdb.d:ro]
    networks: [server-rules, dcs]
  server-rules:
    image: ${SERVER_RULES_IMAGE:?set SERVER_RULES_IMAGE to a Gateway-compatible repository:tag}
    environment:
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
      SD_SERVICE_NAME: rules
      SD_REGISTER_INTERVAL_SECONDS: ${SD_REGISTER_INTERVAL_SECONDS:-30}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${SERVER_RULES_APP_KEY:?Set SERVER_RULES_APP_KEY in .env}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: server-rules-db
      DB_PORT: 5432
      DB_DATABASE: server_rules
      DB_USERNAME: server_rules
      DB_PASSWORD: ${SERVER_RULES_DB_PASSWORD:?Set SERVER_RULES_DB_PASSWORD in .env}
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      server-rules-db:
        condition: service_healthy
    deploy:
      replicas: ${SERVER_RULES_REPLICAS:-2}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/status') === false ? 1 : 0);"]
      start_period: 60s
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [server-rules, backend]
    restart: unless-stopped
  # university-record-db is the HAProxy in front of the university-record-db-1..3 cluster: 5432 the primary, 5433 the replicas.
  university-record-db:
    <<: *postgres-ha-proxy
    depends_on: [university-record-db-1, university-record-db-2, university-record-db-3]
    environment:
      CLUSTER: university-record-db
      PGUSER: university_record
      PGDATABASE: university_record
      PGPASSWORD: ${UNIVERSITY_RECORD_DB_PASSWORD:?Set UNIVERSITY_RECORD_DB_PASSWORD in .env}
    networks: [university-record]
  university-record-db-1:
    <<: *postgres-ha-node
    environment: &university-record-db-node
      PATRONI_SCOPE: university-record-db
      PATRONI_SUPERUSER_USERNAME: university_record
      PATRONI_SUPERUSER_PASSWORD: ${UNIVERSITY_RECORD_DB_PASSWORD:?Set UNIVERSITY_RECORD_DB_PASSWORD in .env}
      POSTGRES_DB: university_record
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?set ETL_DB_PASSWORD in .env}
      PATRONI_NAME: university-record-db-1
    volumes: [university-record-db-1-data:/var/lib/postgresql/data, ./db/university-record:/docker-entrypoint-initdb.d:ro]
    networks: [university-record, dcs]
  university-record-db-2:
    <<: *postgres-ha-node
    environment: {<<: *university-record-db-node, PATRONI_NAME: university-record-db-2}
    volumes: [university-record-db-2-data:/var/lib/postgresql/data, ./db/university-record:/docker-entrypoint-initdb.d:ro]
    networks: [university-record, dcs]
  university-record-db-3:
    <<: *postgres-ha-node
    environment: {<<: *university-record-db-node, PATRONI_NAME: university-record-db-3}
    volumes: [university-record-db-3-data:/var/lib/postgresql/data, ./db/university-record:/docker-entrypoint-initdb.d:ro]
    networks: [university-record, dcs]
  university-record:
    image: ${UNIVERSITY_RECORD_IMAGE:?set UNIVERSITY_RECORD_IMAGE to a Gateway-compatible repository:tag}
    environment:
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
      SD_SERVICE_NAME: records
      SD_REGISTER_INTERVAL_SECONDS: ${SD_REGISTER_INTERVAL_SECONDS:-30}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${UNIVERSITY_RECORD_APP_KEY:?Set UNIVERSITY_RECORD_APP_KEY in .env}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: university-record-db
      DB_PORT: 5432
      DB_DATABASE: university_record
      DB_USERNAME: university_record
      DB_PASSWORD: ${UNIVERSITY_RECORD_DB_PASSWORD:?Set UNIVERSITY_RECORD_DB_PASSWORD in .env}
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      university-record-db:
        condition: service_healthy
    deploy:
      replicas: ${UNIVERSITY_RECORD_REPLICAS:-2}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/status') === false ? 1 : 0);"]
      start_period: 60s
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [university-record, backend]
    restart: unless-stopped

  # ---- Applicant Service ----
  # applicant-db is the HAProxy in front of the applicant-db-1..3 cluster: 5432 the primary, 5433 the replicas.
  applicant-db:
    <<: *postgres-ha-proxy
    depends_on: [applicant-db-1, applicant-db-2, applicant-db-3]
    environment:
      CLUSTER: applicant-db
      PGUSER: applicant
      PGDATABASE: applicant
      PGPASSWORD: ${APPLICANT_DB_PASSWORD:?set APPLICANT_DB_PASSWORD in .env}
    networks: [applicant]
  applicant-db-1:
    <<: *postgres-ha-node
    environment: &applicant-db-node
      PATRONI_SCOPE: applicant-db
      PATRONI_SUPERUSER_USERNAME: applicant
      PATRONI_SUPERUSER_PASSWORD: ${APPLICANT_DB_PASSWORD:?set APPLICANT_DB_PASSWORD in .env}
      POSTGRES_DB: applicant
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?set ETL_DB_PASSWORD in .env}
      PATRONI_NAME: applicant-db-1
    volumes: [applicant-db-1-data:/var/lib/postgresql/data, ./db/applicant:/docker-entrypoint-initdb.d:ro]
    networks: [applicant, dcs]
  applicant-db-2:
    <<: *postgres-ha-node
    environment: {<<: *applicant-db-node, PATRONI_NAME: applicant-db-2}
    volumes: [applicant-db-2-data:/var/lib/postgresql/data, ./db/applicant:/docker-entrypoint-initdb.d:ro]
    networks: [applicant, dcs]
  applicant-db-3:
    <<: *postgres-ha-node
    environment: {<<: *applicant-db-node, PATRONI_NAME: applicant-db-3}
    volumes: [applicant-db-3-data:/var/lib/postgresql/data, ./db/applicant:/docker-entrypoint-initdb.d:ro]
    networks: [applicant, dcs]

  applicant:
    image: ${APPLICANT_IMAGE:-georgerabus/pad-applicant-service:5.0.0-rc.1}
    depends_on:
      applicant-db:
        condition: service_healthy
    environment:
      DB_HOST: applicant-db
      DB_DATABASE: applicant
      DB_USERNAME: applicant
      DB_PASSWORD: ${APPLICANT_DB_PASSWORD:?set APPLICANT_DB_PASSWORD in .env}
      # A new applicant is created by a saga on the broker's POST /sagas: one
      # step per target, in this order, named as each registers with Service
      # Discovery, then Applicant's own.
      HANDOVER_TARGETS: credential,records
      BROKER_URL: http://broker:8000
      # Every replica registers here on startup as http://$HOSTNAME:80.
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
    deploy:
      replicas: ${APPLICANT_REPLICAS:-2}
    networks: [applicant, backend]
    restart: unless-stopped

  # ---- Credential Service ----
  # credential-db is the HAProxy in front of the credential-db-1..3 cluster: 5432 the primary, 5433 the replicas.
  credential-db:
    <<: *postgres-ha-proxy
    depends_on: [credential-db-1, credential-db-2, credential-db-3]
    environment:
      CLUSTER: credential-db
      PGUSER: credential
      PGDATABASE: credential
      PGPASSWORD: ${CREDENTIAL_DB_PASSWORD:?set CREDENTIAL_DB_PASSWORD in .env}
    networks: [credential]
  credential-db-1:
    <<: *postgres-ha-node
    environment: &credential-db-node
      PATRONI_SCOPE: credential-db
      PATRONI_SUPERUSER_USERNAME: credential
      PATRONI_SUPERUSER_PASSWORD: ${CREDENTIAL_DB_PASSWORD:?set CREDENTIAL_DB_PASSWORD in .env}
      POSTGRES_DB: credential
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?set ETL_DB_PASSWORD in .env}
      PATRONI_NAME: credential-db-1
    volumes: [credential-db-1-data:/var/lib/postgresql/data, ./db/credential:/docker-entrypoint-initdb.d:ro]
    networks: [credential, dcs]
  credential-db-2:
    <<: *postgres-ha-node
    environment: {<<: *credential-db-node, PATRONI_NAME: credential-db-2}
    volumes: [credential-db-2-data:/var/lib/postgresql/data, ./db/credential:/docker-entrypoint-initdb.d:ro]
    networks: [credential, dcs]
  credential-db-3:
    <<: *postgres-ha-node
    environment: {<<: *credential-db-node, PATRONI_NAME: credential-db-3}
    volumes: [credential-db-3-data:/var/lib/postgresql/data, ./db/credential:/docker-entrypoint-initdb.d:ro]
    networks: [credential, dcs]

  credential:
    image: ${CREDENTIAL_IMAGE:-georgerabus/pad-credential-service:5.0.0-rc.2}
    depends_on:
      credential-db:
        condition: service_healthy
    environment:
      DB_HOST: credential-db
      DB_DATABASE: credential
      DB_USERNAME: credential
      DB_PASSWORD: ${CREDENTIAL_DB_PASSWORD:?set CREDENTIAL_DB_PASSWORD in .env}
      CREDENTIAL_ISSUER_SECRET: ${CREDENTIAL_ISSUER_SECRET:?set CREDENTIAL_ISSUER_SECRET in .env}
      # Every replica registers here on startup as http://$HOSTNAME:80.
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
    deploy:
      replicas: ${CREDENTIAL_REPLICAS:-2}
    networks: [credential, backend]
    restart: unless-stopped

  # ---- Data warehouse and ETL ----
  # The warehouse holds what every service's database knows, as a star
  # schema, for analysis without touching the services. The ETL loads it every
  # 5 minutes and on POST /etl/run, reading each database's replicas on port
  # 5433 as the read-only user `etl`. Neither publishes a port; Grafana reads
  # the warehouse with a read-only user of its own. See README, "Warehouse and
  # ETL", and the ETL's own README for what each table keeps.
  warehouse-db:
    image: postgres:17
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?set WAREHOUSE_DB_PASSWORD in .env}
      # Read by db/warehouse/10-grafana-reader.sh on the first start, to create
      # the user Grafana reads with.
      WAREHOUSE_GRAFANA_PASSWORD: ${WAREHOUSE_GRAFANA_PASSWORD:?set WAREHOUSE_GRAFANA_PASSWORD in .env}
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data
      - ./db/warehouse:/docker-entrypoint-initdb.d:ro
    networks: [warehouse]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  etl:
    image: ${ETL_IMAGE:-catalinasiminiuc/pad-etl-service:5.0.0-rc.3}
    depends_on:
      warehouse-db:
        condition: service_healthy
    environment:
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?set ETL_DB_PASSWORD in .env}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?set WAREHOUSE_DB_PASSWORD in .env}
      ETL_INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-300}
      # Registered like every service, so Service Discovery health-checks it.
      SERVICE_DISCOVERY_URL: http://service-discovery:8000
    # Every service database's network, to reach its replicas under the same
    # host name the service uses; the warehouse's; and backend, for Service
    # Discovery and the broker's `logs` topic.
    networks: [warehouse, backend, player, session, moderation, dm, applicant, credential,
               server-rules, university-record]
    restart: unless-stopped

  # ---- Monitoring ----
  # Behind the `monitoring` profile, so `docker compose up` starts the system
  # as it always has and nobody pays for four more containers they did not
  # ask for. Start them with:
  #
  #     docker compose --profile monitoring up -d
  #
  # Grafana is then at http://localhost:3300, with the dashboard already
  # loaded and both data sources already connected.

  # Collects the numbers. One target for the whole system: Service Discovery
  # serves what every instance last reported at GET /metrics, so no service
  # has a metrics endpoint of its own to maintain.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Long enough to look back over a demonstration, short enough that the
      # volume does not grow without anyone noticing.
      - --storage.tsdb.retention.time=48h
      - --web.enable-lifecycle
      # Tempo writes the service graph and span metrics here.
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [backend]
    restart: unless-stopped

  # Holds the lines: the system's log store, which the Gateway's GET /logs
  # reads from. Not in the monitoring profile, unlike the dashboards: logs are
  # part of the system, and the download must work without Grafana running.
  # One process, filesystem storage: this watches eleven services on one
  # machine, and a clustered log store would be more moving parts than the
  # thing being monitored.
  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks: [backend]
    restart: unless-stopped

  # Ships every container's output to Loki. Containers are discovered through
  # the Docker API rather than listed, so a replica started with
  # `--scale player=4` is collected from without any config change.
  promtail:
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Read-only, and only ever used to list containers and read their
      # output. Nothing here starts, stops or changes a container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/promtail
    depends_on: [loki]
    networks: [backend]
    restart: unless-stopped

  # Holds the spans: one request as a timeline across every service it
  # reached. Services send them over OTLP/HTTP on 4318. Its metrics generator
  # turns spans into the service graph and request rates, written to
  # Prometheus.
  tempo:
    image: grafana/tempo:2.6.1
    profiles: [monitoring]
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [backend]
    restart: unless-stopped

  # Draws it. The dashboard and both data sources are provisioned from files
  # in this repository, so the stack comes up with them already there instead
  # of someone clicking them together before a demonstration.
  grafana:
    image: grafana/grafana:11.4.0
    profiles: [monitoring]
    environment:
      # A dashboard of counts and container names, on a developer's own
      # machine. A login would be one more thing to remember and nothing
      # here is worth protecting; the port is bound to the loopback address
      # either way.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      # Opens on the system overview rather than on an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pad-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # The warehouse data source reads it from here; Grafana's user is read-only.
      WAREHOUSE_GRAFANA_PASSWORD: ${WAREHOUSE_GRAFANA_PASSWORD:-}
    volumes:
      # The two subdirectories, not the whole provisioning folder: mounting
      # over it would hide the empty `alerting` and `plugins` directories the
      # image ships, and Grafana logs an error for each one it cannot find.
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Not 3000: the NestJS services already use it inside the network, and
      # it is the port most likely to be taken on a developer's machine.
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    depends_on: [prometheus, loki, tempo]
    # backend for Prometheus, Loki and Tempo; warehouse for the warehouse.
    networks: [backend, warehouse]
    restart: unless-stopped

# One private network per service for its database, and a shared one the
# services use to reach each other.
networks:
  applicant:
  credential:
  server-rules:
  university-record:
  backend:
  player:
  session:
  dm:
  moderation:
  dcs:
  warehouse:
  # The Gateway and the Valkey nodes, and nothing else.
  cache:

volumes:
  broker-data:
  etcd-1-data:
  etcd-2-data:
  etcd-3-data:
  player-db-1-data:
  player-db-2-data:
  player-db-3-data:
  session-db-1-data:
  session-db-2-data:
  session-db-3-data:
  dm-db-1-data:
  dm-db-2-data:
  dm-db-3-data:
  moderation-db-1-data:
  moderation-db-2-data:
  moderation-db-3-data:
  server-rules-db-1-data:
  server-rules-db-2-data:
  server-rules-db-3-data:
  university-record-db-1-data:
  university-record-db-2-data:
  university-record-db-3-data:
  applicant-db-1-data:
  applicant-db-2-data:
  applicant-db-3-data:
  credential-db-1-data:
  credential-db-2-data:
  credential-db-3-data:
  prometheus-data:
  loki-data:
  promtail-data:
  grafana-data:
  tempo-data:
  warehouse-db-data:
