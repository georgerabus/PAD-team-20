# Runs the system from the images published on Docker Hub.
#
# Every service owns its own PostgreSQL database, which only that service can
# reach: the databases publish no ports and sit on the service's own network.
#
# Before the first `docker compose up`:
#   1. cp .env.example .env, and fill in every value
#   2. generate the RS256 keypairs the two token issuers sign with:
#        mkdir -p keys/player keys/session
#        openssl genrsa -out keys/player/private.pem 2048
#        openssl rsa -in keys/player/private.pem -pubout -out keys/player/public.pem
#        openssl genrsa -out keys/session/private.pem 2048
#        openssl rsa -in keys/session/private.pem -pubout -out keys/session/public.pem
#
# Database schemas live in db/<service>/ and run on the first start of an
# empty volume.

name: pad-team-20

services:
  # ---- Player Service ----
  player-db:
    image: postgres:17
    environment:
      POSTGRES_DB: player
      POSTGRES_USER: player
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD:?set PLAYER_DB_PASSWORD in .env}
    volumes:
      - player-db-data:/var/lib/postgresql/data
      - ./db/player:/docker-entrypoint-initdb.d:ro
    networks: [player]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U player -d player"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  player:
    image: catalinasiminiuc/pad-player-service:1.1.1
    depends_on:
      player-db:
        condition: service_healthy
    environment:
      PORT: 3000
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      DB_HOST: player-db
      DB_PORT: 5432
      DB_NAME: player
      DB_USER: player
      DB_PASSWORD: ${PLAYER_DB_PASSWORD:?set PLAYER_DB_PASSWORD in .env}
    volumes:
      - ./keys/player:/app/keys:ro
    ports:
      - "3000:3000"
    networks: [player, backend]
    restart: unless-stopped

  # ---- Server Moderation Session Service ----
  session-db:
    image: postgres:17
    environment:
      POSTGRES_DB: session
      POSTGRES_USER: session
      POSTGRES_PASSWORD: ${SESSION_DB_PASSWORD:?set SESSION_DB_PASSWORD in .env}
    volumes:
      - session-db-data:/var/lib/postgresql/data
      - ./db/session:/docker-entrypoint-initdb.d:ro
    networks: [session]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U session -d session"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  session:
    image: catalinasiminiuc/pad-server-moderation-session-service:1.1.1
    depends_on:
      session-db:
        condition: service_healthy
    environment:
      PORT: 3001
      SESSION_JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      SESSION_JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      # Player's public key, so player tokens are validated without calling Player.
      PLAYER_JWT_PUBLIC_KEY_PATH: /app/player-keys/public.pem
      SERVICE_SECRET: ${SERVICE_SECRET:?set SERVICE_SECRET in .env}
      DB_HOST: session-db
      DB_PORT: 5432
      DB_NAME: session
      DB_USER: session
      DB_PASSWORD: ${SESSION_DB_PASSWORD:?set SESSION_DB_PASSWORD in .env}
    volumes:
      - ./keys/session:/app/keys:ro
      # Only Player's public key, never its private one.
      - ./keys/player/public.pem:/app/player-keys/public.pem:ro
    ports:
      - "3001:3001"
    networks: [session, backend]
    restart: unless-stopped

  # ---- Discord DMs Service ----
  dm-db:
    image: postgres:17
    environment:
      POSTGRES_DB: dm
      POSTGRES_USER: dm
      POSTGRES_PASSWORD: ${DM_DB_PASSWORD:?set DM_DB_PASSWORD in .env}
    volumes:
      - dm-db-data:/var/lib/postgresql/data
      - ./db/dm:/docker-entrypoint-initdb.d:ro
    networks: [dm]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm -d dm"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  dm-service:
    image: augustinploteanu/pad-dm-service:0.2.0
    depends_on:
      dm-db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: dm-db
      DB_PORT: 5432
      DB_NAME: dm
      DB_USER: dm
      DB_PASSWORD: ${DM_DB_PASSWORD:?set DM_DB_PASSWORD in .env}
    ports:
      - "3002:3000"
    networks: [dm, backend]
    restart: unless-stopped

  # ---- Moderation Service ----
  moderation-db:
    image: postgres:17
    environment:
      POSTGRES_DB: moderation
      POSTGRES_USER: moderation
      POSTGRES_PASSWORD: ${MODERATION_DB_PASSWORD:?set MODERATION_DB_PASSWORD in .env}
    volumes:
      - moderation-db-data:/var/lib/postgresql/data
      - ./db/moderation:/docker-entrypoint-initdb.d:ro
    networks: [moderation]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moderation -d moderation"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  moderation-service:
    image: augustinploteanu/pad-moderation-service:0.2.0
    depends_on:
      moderation-db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: moderation-db
      DB_PORT: 5432
      DB_NAME: moderation
      DB_USER: moderation
      DB_PASSWORD: ${MODERATION_DB_PASSWORD:?set MODERATION_DB_PASSWORD in .env}
    ports:
      - "3003:3000"
    networks: [moderation, backend]
    restart: unless-stopped

  server-rules-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: server_rules
      POSTGRES_USER: server_rules
      POSTGRES_PASSWORD: ${SERVER_RULES_DB_PASSWORD:?Set SERVER_RULES_DB_PASSWORD in .env}
    volumes:
      - server-rules-db-data:/var/lib/postgresql/data
      - ./db/server-rules:/docker-entrypoint-initdb.d:ro
    networks: [server-rules]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U server_rules -d server_rules"]
      interval: 3s
      timeout: 3s
      retries: 20
  server-rules:
    image: loredanaaaa/server-rules-service:1.0.0
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${SERVER_RULES_APP_KEY:?Set SERVER_RULES_APP_KEY in .env}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: server-rules-db
      DB_PORT: 5432
      DB_DATABASE: server_rules
      DB_USERNAME: server_rules
      DB_PASSWORD: ${SERVER_RULES_DB_PASSWORD:?Set SERVER_RULES_DB_PASSWORD in .env}
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MOCK_AUTH_ENABLED: "true"
      # Public lab fixtures matching the Postman collection; not real credentials.
      MOCK_SESSION_SERVICE_TOKEN: lab-session-service
      MOCK_MODERATION_SERVICE_TOKEN: lab-moderation-service
      MOCK_PLAYER_TOKEN: lab-player
      MOCK_SESSION_ID: 11111111-1111-4111-8111-111111111111
    ports:
      - "127.0.0.1:${SERVER_RULES_PORT:-8001}:80"
    depends_on:
      server-rules-db:
        condition: service_healthy
    networks: [server-rules, backend]
  university-record-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: university_record
      POSTGRES_USER: university_record
      POSTGRES_PASSWORD: ${UNIVERSITY_RECORD_DB_PASSWORD:?Set UNIVERSITY_RECORD_DB_PASSWORD in .env}
    volumes:
      - university-record-db-data:/var/lib/postgresql/data
      - ./db/university-record:/docker-entrypoint-initdb.d:ro
    networks: [university-record]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U university_record -d university_record"]
      interval: 3s
      timeout: 3s
      retries: 20
  university-record:
    image: loredanaaaa/university-record-service:1.0.0
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${UNIVERSITY_RECORD_APP_KEY:?Set UNIVERSITY_RECORD_APP_KEY in .env}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: university-record-db
      DB_PORT: 5432
      DB_DATABASE: university_record
      DB_USERNAME: university_record
      DB_PASSWORD: ${UNIVERSITY_RECORD_DB_PASSWORD:?Set UNIVERSITY_RECORD_DB_PASSWORD in .env}
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MOCK_AUTH_ENABLED: "true"
      MOCK_BOOTSTRAP_ENABLED: "true"
    ports:
      - "127.0.0.1:${UNIVERSITY_RECORD_PORT:-8002}:80"
    depends_on:
      university-record-db:
        condition: service_healthy
    networks: [university-record, backend]

# One private network per service for its database, and a shared one the
# services use to reach each other.
networks:
  server-rules:
  university-record:
  backend:
  player:
  session:
  dm:
  moderation:

volumes:
  server-rules-db-data:
  university-record-db-data:
  player-db-data:
  session-db-data:
  dm-db-data:
  moderation-db-data:
