# Tempo as a single process, holding the spans the services send.
#
# A span is one piece of work: the Gateway receiving a request, the broker
# delivering it, Session handling it, Session's gRPC call to Moderation. Every
# span of one user request shares a trace id, so Grafana can draw the request
# as one timeline across every service it reached. The same id is in each of
# those services' log lines, which is what links a trace to its logs.
#
# The same shape as Loki here: one node, filesystem storage, two days.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        # What every service sends to, as OTEL_EXPORTER_OTLP_ENDPOINT.
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Short, so a trace is searchable within minutes of being written, which is
  # what a demonstration needs.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

# Spans become metrics as well: which service calls which, how often, how
# slowly and how often it fails. Written to Prometheus, which is what Grafana's
# service graph reads.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]

usage_report:
  reporting_enabled: false
